[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI declares form fields and uploads with calls in default arguments (File(), Form()).
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Text the model reads (system prompt, tool schemas, eval cases) reads best one rule per line;
# wrapping would make it harder to review what the model actually sees. The agent loop itself is checked.
"concierge/prompts.py" = ["E501"]
"concierge/tool_schemas.py" = ["E501"]
"evals/run_evals.py" = ["E501"]
