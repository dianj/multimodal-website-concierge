[pytest]
testpaths = tests
addopts = -m "not live"
markers =
    e2e: browser tests with Playwright (use --browser-channel msedge to run on an installed Edge)
    live: evaluations against a real LM Studio model (run with: pytest -m live)
filterwarnings =
    # emitted by the third-party pytest-base-url plugin, not by this project
    ignore:Session-scoped fixtures defined as instance methods are deprecated:pytest.PytestRemovedIn10Warning
